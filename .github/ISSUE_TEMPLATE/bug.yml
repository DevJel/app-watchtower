name: Bug report
description: Report reproducible behavior without secrets
title: "[Bug] "
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps and environment
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence only — no credentials or customer data
